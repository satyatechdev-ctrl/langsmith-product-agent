[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langsmith-product-agent"
version = "0.1.0"
description = "A read-only LangChain product database agent deployable to LangSmith"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "sqlglot>=26.0,<30.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.35",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/product_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "W"]
ignore = ["S101"]
